<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1324"/>
      <stop offset="100%" stop-color="#070d1f"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Sync Icon with Glowing Gradient -->
  <g fill="none" stroke="url(#icon-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Top-right arc -->
    <path d="M 44 24 A 14 14 0 0 0 20 20 L 16 20"/>
    <!-- Top-left arrow head -->
    <polyline points="22 14 16 20 22 26"/>
    
    <!-- Bottom-left arc -->
    <path d="M 20 40 A 14 14 0 0 0 44 44 L 48 44"/>
    <!-- Bottom-right arrow head -->
    <polyline points="42 38 48 44 42 50"/>
  </g>

  <!-- Center Active Status Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#10b981" filter="url(#glow)"/>
</svg>
